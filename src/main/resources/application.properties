spring.application.name=backend

# Puerto: las plataformas de despliegue (Railway, Render) lo asignan por la variable PORT.
server.port=${PORT:8080}

# Base de datos: los valores por defecto son los del docker-compose local.
# En produccion vienen de variables de entorno, nunca del repo.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/rumbou}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rumbou}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rumbou}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}

# El valor por defecto de aqui es SOLO para desarrollo local.
# En produccion, esta variable de entorno (JWT_SECRET) debe venir configurada aparte, nunca en el repo.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-1234567890abcdef}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Solo la usa el script de generacion de preguntas (profile "generar-preguntas",
# ver contenido/gemini/GeneradorPreguntasRunner). Nunca poner la key real aqui:
# siempre debe venir de la variable de entorno GEMINI_API_KEY.
gemini.api-key=${GEMINI_API_KEY:}

# Servicio de correo: SOLO para desarrollo local. En produccion vienen de variables de entorno.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
