spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/rumbou
spring.datasource.username=rumbou
spring.datasource.password=rumbou

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# El valor por defecto de aqui es SOLO para desarrollo local.
# En produccion, esta variable de entorno (JWT_SECRET) debe venir configurada aparte, nunca en el repo.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-1234567890abcdef}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000
