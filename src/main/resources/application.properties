spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/rumbou
spring.datasource.username=rumbou
spring.datasource.password=rumbou

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# El valor por defecto de aqui es SOLO para desarrollo local.
# En produccion, esta variable de entorno (JWT_SECRET) debe venir configurada aparte, nunca en el repo.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-1234567890abcdef}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Solo la usa el script de generacion de preguntas (profile "generar-preguntas",
# ver contenido/gemini/GeneradorPreguntasRunner). Nunca poner la key real aqui:
# siempre debe venir de la variable de entorno GEMINI_API_KEY.
gemini.api-key=${GEMINI_API_KEY:}

# Servicio de correo: SOLO para desarrollo local. En produccion vienen de variables de entorno.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
