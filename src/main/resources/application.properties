spring.application.name=backend

# Sin un perfil elegido se activa "seed": cualquier forma de arrancar (IDE o Maven) carga
# el catalogo, las preguntas y la cuenta de evaluacion. Es idempotente, no duplica datos.
spring.profiles.default=seed

# Las plataformas de despliegue asignan el puerto por la variable PORT.
server.port=${PORT:8080}

# Valores por defecto = docker-compose local; en produccion vienen de variables de entorno.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/rumbou}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:rumbou}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rumbou}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# El valor por defecto es solo para desarrollo local; en produccion JWT_SECRET es obligatoria.
jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-1234567890abcdef}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Administrador inicial: con ambas variables definidas, al arrancar se crea (o se
# promueve) ese usuario con rol ADMIN; sin ellas no pasa nada (seed/AdminBootstrapRunner).
admin.email=${ADMIN_EMAIL:}
admin.password=${ADMIN_PASSWORD:}

# Gemini: la usan el generador de preguntas y el tutor de IA. La key real nunca va aqui.
gemini.api-key=${GEMINI_API_KEY:}
# Google retira modelos con el tiempo: se cambia por variable de entorno sin recompilar.
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
# Pausa entre llamadas del generador (--todos) para no pasar el limite por minuto.
generador.pausa-entre-llamadas-ms=${GENERADOR_PAUSA_MS:6500}

# Correo SMTP: valores de desarrollo local; en produccion vienen de variables de entorno.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:rumbou}
spring.mail.password=${MAIL_PASSWORD:rumbou}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# CORS: lista separada por comas. En produccion, el dominio del frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Link del correo de recuperacion; el token se agrega como ?token=.
app.frontend.reset-password-url=${APP_RESET_PASSWORD_URL:https://rumbou.edu.pe/recuperar}

# Mercado Pago: MP_ACCESS_TOKEN crea las preaprobaciones y MP_WEBHOOK_SECRET valida
# la firma (header x-signature) de cada notificacion. Sin el secreto no se valida.
mercadopago.access-token=${MP_ACCESS_TOKEN:}
mercadopago.webhook-secret=${MP_WEBHOOK_SECRET:}
mercadopago.back-url=${MP_BACK_URL:https://github.com/marcobautista-sketch/rumbou-backend}
mercadopago.test-payer-email=${MP_TEST_PAYER_EMAIL:}
